onboarding = false

[keys]
# ^N, as in ~/.tmux.conf: ctrl+b messes up vim.  Press it twice to send a literal ^N
# (tmux's 'bind n send-prefix').
prefix = "ctrl+n"
# F9 opens a new tab (~/.tmux.conf: bind-key -T root F9 new-window)
new_tab = "f9"
# tmux-style window navigation (matches ~/.tmux.conf root-table F6/F7/F8)
previous_tab = "f7"
next_tab = "f8"
last_pane = "f6"

[ui.toast]
# herdr: in-app toasts when a background agent finishes or needs input.  ("terminal",
# a desktop notification through iTerm2 over ssh, showed nothing: iTerm2 didn't take it.)
delivery = "herdr"

[ui.toast.herdr]
# top-right: the default bottom-right toast was missed (it lands near claude's input box)
position = "top-right"
